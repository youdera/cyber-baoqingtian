name: Check announcement browser
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python app.py --help
      - run: python notice_app.py --help
      - run: node --check web/notices.js
      - run: node --check web/alerts.js
      - run: node --check web/source-catalog.js
      - run: node tests/test_guide.cjs
